
name: Cache Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  cache-job:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Demo
        uses: actions/cache@v4
        with:
          path: demo-cache
          key: demo-cache-v1

      - name: Show Message
        run: echo "Hello Adeel! Cache workflow is working."
