
name: Push and Pull Request Events

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  event-check:
    runs-on: ubuntu-latest

    steps:
      - name: Show Event Details
        run: |
          echo "Hello Adeel!"
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Actor: ${{ github.actor }}"
