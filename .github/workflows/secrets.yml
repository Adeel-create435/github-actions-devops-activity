
name: GitHub Secrets Demo

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  secret-job:
    runs-on: ubuntu-latest
    steps:
      - name: Check Secret
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "Secret is configured successfully."
          else
            echo "Secret is missing."
            exit 1
          fi
